# LeX-10K whole-image OCR fine-tuning. Start from the official PixelDiT T2I
# checkpoint; do not resume the earlier ineffective LeX run.
data:
  data_dir:
    - /home/wangye/projects/PixelDiT-master/t2i/data/lex10k_wids
  image_size: 1024
  caption_proportion:
    prompt: 1
  external_caption_suffixes: []
  external_clipscore_suffixes: []
  clip_thr_temperature: 0.1
  clip_thr: 0.0
  load_text_feat: false
  transform: default_train
  type: PixelDatasetMS
  sort_dataset: false
  exclude_indices_path: /home/wangye/projects/PixelDiT-master/t2i/data/lex10k_wids/lex10k_holdout_30.json
  # This controls only the target string. No annotation geometry is passed to
  # UniRec; it receives the complete recovered PixelDiT image.
  return_ocr_transcript: true
  ocr_valid_only: true
  ocr_min_rec_score: 0.95
  ocr_transcript_separator: "\n"

model:
  model: PixDiTTrainer
  image_size: 1024
  mixed_precision: bf16
  fp32_attention: true
  load_from: /home/wangye/projects/PixelDiT-1300M-1024px/pixeldit_t2i_v1.pth
  resume_from: null
  aspect_ratio_type: ASPECT_RATIO_1024
  multi_scale: true
  class_dropout_prob: 0.1
  extra:
    patch_size: 16
    num_groups: 24
    hidden_size: 1536
    pixel_hidden_size: 16
    pixel_attn_hidden_size: 1152
    pixel_num_groups: 16
    patch_depth: 14
    pixel_depth: 2
    num_text_blocks: 4
    txt_embed_dim: 2304
    txt_max_length: 300
    use_text_rope: true
    text_rope_theta: 10000.0
    repa_encoder_index: 6

text_encoder:
  text_encoder_name: gemma-2-2b-it
  y_norm: true
  y_norm_scale_factor: 0.01
  model_max_length: 300
  # Do not prepend the long CHI prompt-enhancement instruction. The LeX
  # prompt already expresses the exact visible text to render.
  chi_prompt: []

scheduler:
  predict_flow_v: true
  noise_schedule: linear_flow
  pred_sigma: false
  learn_sigma: false
  flow_shift: 4.0
  weighting_scheme: logit_normal
  logit_mean: 0.0
  logit_std: 1.0
  vis_sampler: flow_dpm-solver

train:
  num_workers: 10
  seed: 1
  train_batch_size: 2
  num_epochs: 10
  gradient_accumulation_steps: 1
  grad_checkpointing: true
  gradient_clip: 0.1
  repa_loss_weight: 0.0
  optimizer:
    betas: [0.9, 0.999, 0.9999]
    eps: [1.0e-30, 1.0e-16]
    lr: 2.0e-05
    type: CAMEWrapper
    weight_decay: 0.0
  override_lr_on_resume: true
  lr_schedule: constant
  lr_schedule_args:
    num_warmup_steps: 2000
  local_save_vis: true
  visualize: true
  validate_at_start: false
  validation_prompts_file: /home/wangye/projects/PixelDiT-master/t2i/data/lex10k_wids/lex10k_holdout_30.json
  validation_prompts: []
  eval_sampling_steps: 300
  log_interval: 20
  save_model_epochs: 0
  save_model_steps: 300
  keep_recovery_checkpoints: 1
  work_dir: output/lex10k_1024_ocr_unirec
  online_metric: false
  eval_metric_step: 2000
  online_metric_dir: metric_helper
  # Frozen whole-image UniRec token CE. It is computed only for a random 25%
  # of low-noise samples (sigma <= 0.25), and never uses GT text coordinates.
  ocr_loss_weight: 0.05
  ocr_model_path: /home/wangye/huggingface_ckpts/unirec-0.1b
  ocr_probability: 0.25
  ocr_max_samples_per_batch: 1
  ocr_max_sigma: 0.25
  ocr_max_tokens: 256
  ocr_max_width: 960
  ocr_max_height: 1408
  ocr_size_divisor: 64
