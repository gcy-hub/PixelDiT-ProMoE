# AnyWord RGB fine-tuning: Stage 3 optimization settings at 512px multiscale.
data:
  data_dir: [../dataset/pixeldit_wids_text]
  exclude_indices_path: configs/anyword_rgb_512_holdout.json
  image_size: 512
  caption_proportion:
    prompt: 1
  external_caption_suffixes: []
  external_clipscore_suffixes: []
  clip_thr_temperature: 0.1
  clip_thr: 0.0
  load_text_feat: false
  transform: default_train
  type: PixelDatasetMS
  sort_dataset: false

model:
  model: PixDiTTrainer
  image_size: 512
  mixed_precision: bf16
  fp32_attention: true
  load_from:
  resume_from:
  aspect_ratio_type: ASPECT_RATIO_512
  multi_scale: true
  class_dropout_prob: 0.1
  extra:
    patch_size: 16
    num_groups: 24
    hidden_size: 1536
    pixel_hidden_size: 16
    pixel_attn_hidden_size: 1152
    pixel_num_groups: 16
    patch_depth: 14
    pixel_depth: 2
    num_text_blocks: 4
    txt_embed_dim: 2304
    txt_max_length: 300
    use_text_rope: true
    text_rope_theta: 10000.0
    repa_encoder_index: 6

text_encoder:
  text_encoder_name: gemma-2-2b-it
  y_norm: true
  y_norm_scale_factor: 0.01
  model_max_length: 300
  chi_prompt:
    - 'Given a user prompt, generate an "Enhanced prompt" that provides detailed visual descriptions suitable for image generation. Evaluate the level of detail in the user prompt:'
    - '- If the prompt is simple, focus on adding specifics about colors, shapes, sizes, textures, and spatial relationships to create vivid and concrete scenes.'
    - '- If the prompt is already detailed, refine and enhance the existing details slightly without overcomplicating.'
    - 'Here are examples of how to transform or refine prompts:'
    - '- User Prompt: A cat sleeping -> Enhanced: A small, fluffy white cat curled up in a round shape, sleeping peacefully on a warm sunny windowsill, surrounded by pots of blooming red flowers.'
    - '- User Prompt: A busy city street -> Enhanced: A bustling city street scene at dusk, featuring glowing street lamps, a diverse crowd of people in colorful clothing, and a double-decker bus passing by towering glass skyscrapers.'
    - 'Please generate only the enhanced description for the prompt below and avoid including any additional commentary or evaluations:'
    - 'User Prompt: '

scheduler:
  predict_flow_v: true
  noise_schedule: linear_flow
  pred_sigma: false
  learn_sigma: false
  flow_shift: 4.0
  weighting_scheme: logit_normal
  logit_mean: 0.0
  logit_std: 1.0
  vis_sampler: flow_dpm-solver

train:
  num_workers: 10
  seed: 1
  train_batch_size: 3
  num_epochs: 10
  gradient_accumulation_steps: 1
  grad_checkpointing: true
  gradient_clip: 0.1
  repa_loss_weight: 0.0
  optimizer:
    betas: [0.9, 0.999, 0.9999]
    eps: [1.0e-30, 1.0e-16]
    lr: 2.0e-5
    type: CAMEWrapper
    weight_decay: 0.0
  override_lr_on_resume: true
  auto_lr:
  lr_schedule: constant
  lr_schedule_args:
    num_warmup_steps: 2000
  local_save_vis: true
  visualize: true
  validation_prompts:
    - 'the unforgetable nat king cole, with the visible words "KING", "COLE", and "NAT" clearly rendered in the image.'
    - 'bbb accredited business, with the visible words "ACCREDITED", "BUSINESS", "BBB", and "A+" clearly rendered in the image.'
    - 'assassin''s creed rebellion, with the visible words "REBELLION" and "CREED" clearly rendered in the image.'
    - 'peppermint valentine hearts, with the visible words "Hearts", "VALENTINE", and "Peppermint" clearly rendered in the image.'
    - 'fit fudge logo, with the visible words "HEALTHY" and "FUDGE" clearly rendered in the image.'
    - 'a brushed metal cafe sign on a brick wall, with the exact visible word "EMBER" clearly rendered in warm amber letters'
    - 'a minimal violet cosmetics poster, with the exact visible words "LUNA" and "GLOW" clearly rendered in white lettering'
    - 'a retro arcade cabinet display, with the exact visible word "HIGHSCORE" clearly rendered in neon green pixels'
    - 'a red emergency exit sign, with the exact visible words "KEEP CLEAR" clearly rendered in white block letters'
    - 'a blue hardcover book cover, with the exact visible title "THE LAST ORBIT" clearly rendered in silver serif letters'
  eval_sampling_steps: 500
  validate_at_start: false
  log_interval: 20
  save_model_epochs: 0
  save_model_steps: 1000
  keep_recovery_checkpoints: 1
  work_dir: output/anyword_rgb_512
  online_metric: false
  eval_metric_step: 20000
  online_metric_dir: metric_helper
